<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1eb" />
    <title>Daily Board · 每日看板</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Daily Board 首页">
          <span class="brand-mark" aria-hidden="true">DB</span>
          <span class="brand-copy">
            <strong>Daily Board</strong>
            <span>你的每日信息台</span>
          </span>
        </a>
        <div class="topbar-right">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="sync-status">正在连接数据源</span>
          <button id="refresh-button" class="icon-button" type="button" title="刷新数据" aria-label="刷新数据">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <main>
        <section class="masthead">
          <div class="masthead-copy">
            <p class="eyebrow">今日信号 / <span id="date-label">今天</span></p>
            <h1>今天值得看什么？</h1>
            <p class="lede">把值得留下的信号，压缩成一页。</p>
          </div>
          <div class="day-stamp" aria-label="当前日期">
            <span id="day-number">--</span>
            <span id="day-month">---</span>
          </div>
        </section>

        <nav class="section-tabs" aria-label="内容栏目">
          <button class="tab is-active" type="button" data-section="ai"><span class="tab-index">01</span>AI 信号</button>
          <button class="tab" type="button" data-section="market"><span class="tab-index">02</span>金融</button>
          <button class="tab" type="button" data-section="game"><span class="tab-index">03</span>游戏</button>
          <button class="tab" type="button" data-section="sports"><span class="tab-index">04</span>竞技</button>
          <button class="tab" type="button" data-section="entertainment"><span class="tab-index">05</span>文娱</button>
        </nav>

        <section id="feed-section" class="content-section">
          <div class="section-heading">
            <div>
              <p id="section-eyebrow" class="eyebrow">精选信息流</p>
              <h2 id="section-title">AI 信号</h2>
            </div>
            <div class="section-controls">
              <label class="search-field">
                <span aria-hidden="true">⌕</span>
                <input id="search-input" type="search" placeholder="筛选标题或摘要" autocomplete="off" />
              </label>
              <select id="sort-select" aria-label="排序方式">
                <option value="time">最新发布</option>
                <option value="heat">热度优先</option>
              </select>
            </div>
          </div>

          <div id="source-filters" class="source-filters" role="group" aria-label="来源筛选">
            <button class="source-filter is-active" type="button" data-source="all">全部 <span id="all-count">--</span></button>
            <button class="source-filter" type="button" data-source="thinking-machines">Thinking Machines <span data-count-for="thinking-machines">--</span></button>
            <button class="source-filter" type="button" data-source="jiqizhixin-zhihu">机器之心 <span data-count-for="jiqizhixin-zhihu">--</span></button>
          </div>
          <div id="market-scope-filters" class="market-scope-filters" role="group" aria-label="市场范围" hidden></div>
          <div id="game-subfilters" class="game-subfilters" role="tablist" aria-label="游戏子板块" hidden></div>

          <div id="feed-grid" class="feed-grid" aria-live="polite">
            <div class="state-panel is-loading">
              <span class="spinner" aria-hidden="true"></span>
              <span>正在读取今天的信号</span>
            </div>
          </div>
        </section>

        <section id="placeholder-section" class="placeholder-section" hidden>
          <div class="placeholder-icon" aria-hidden="true">＋</div>
          <p class="eyebrow" id="placeholder-eyebrow">下一模块</p>
          <h2 id="placeholder-title">市场数据</h2>
          <p id="placeholder-copy">这个栏目先留在看板里，接入数据源后会在这里出现。</p>
          <div class="planned-sources" id="planned-sources"></div>
        </section>

        <section class="bottom-grid">
          <article class="brief-panel">
            <div class="panel-label"><span class="panel-dot coral"></span>今日节奏</div>
            <div class="brief-row"><span>已抓取</span><strong id="total-count">--</strong><span>条内容</span></div>
            <div class="progress-track"><span id="progress-fill"></span></div>
            <p id="last-sync">等待第一次同步</p>
          </article>
          <article class="brief-panel source-panel">
            <div class="panel-label"><span class="panel-dot teal"></span>数据源状态</div>
            <div id="source-status-list" class="source-status-list">
              <div class="status-line"><span>Thinking Machines</span><span class="status-pending">等待</span></div>
              <div class="status-line"><span>机器之心 · 知乎</span><span class="status-pending">等待</span></div>
            </div>
          </article>
        </section>
      </main>

      <footer class="footer">
        <span>每日看板 / 个人版</span>
        <span>数据只保存在当前设备</span>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
